<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OGP source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /*
      SNSサムネイル（OGP画像）の版下。1200×630 で書き出す。
      中央 630×630 の正方形を「セーフゾーン」とし、正方形に切り抜かれても
      タイトル・キャッチ・生成例が欠けないよう主要素をすべてその幅に収める。
      書き出し: tools/build-ogp.ps1
    */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
      background: #faf8fd;
      font-family: "Zen Kaku Gothic New", "Yu Gothic UI", sans-serif;
      color: #2b2540;
      -webkit-font-smoothing: antialiased;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
    }

    .blob--lavender {
      width: 700px;
      height: 700px;
      top: -260px;
      right: -190px;
      background: radial-gradient(circle at 32% 34%, rgba(205, 190, 245, 0.95), rgba(205, 190, 245, 0) 68%);
    }

    .blob--rose {
      width: 620px;
      height: 620px;
      bottom: -230px;
      left: -200px;
      background: radial-gradient(circle at 58% 42%, rgba(247, 205, 224, 0.9), rgba(247, 205, 224, 0) 68%);
    }

    .blob--lemon {
      width: 460px;
      height: 460px;
      bottom: -180px;
      right: -60px;
      background: radial-gradient(circle at 42% 58%, rgba(250, 230, 170, 0.85), rgba(250, 230, 170, 0) 68%);
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(107, 79, 187, 0.16);
    }

    .ring--1 { width: 240px; height: 240px; top: 78px; left: 66px; }
    .ring--2 { width: 120px; height: 120px; bottom: 84px; left: 214px; border-color: rgba(107, 79, 187, 0.12); }
    .ring--3 { width: 200px; height: 200px; bottom: 54px; right: 92px; border-color: rgba(107, 79, 187, 0.1); }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 40px 0;
    }

    .title {
      width: 630px;
      font-family: "Shippori Mincho", "Yu Mincho", serif;
      font-weight: 700;
      font-size: 72px;
      line-height: 1.3;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .tagline {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #533a9c;
    }

    .sample {
      width: 640px;
      padding: 16px 22px;
      background: #fff;
      border: 1px solid #e3ddf0;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(43, 37, 64, 0.09);
      transform: rotate(-0.8deg);
    }

    .sample__row {
      display: flex;
      gap: 12px;
      align-items: baseline;
    }

    .sample__row + .sample__row {
      margin-top: 8px;
    }

    .sample__who {
      flex: 0 0 96px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #6b6480;
    }

    .sample__them {
      font-size: 19px;
      line-height: 1.6;
      color: #6b6480;
    }

    .sample__you {
      font-family: "Shippori Mincho", "Yu Mincho", serif;
      font-size: 23px;
      line-height: 1.6;
    }

    .sample__you mark {
      background: linear-gradient(transparent 62%, #ffe4a3 62%);
      color: inherit;
    }

    .badges {
      display: flex;
      gap: 12px;
    }

    .badge {
      padding: 8px 20px;
      font-size: 18px;
      font-weight: 500;
      color: #533a9c;
      background: rgba(236, 230, 250, 0.95);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <span class="blob blob--lavender"></span>
  <span class="blob blob--rose"></span>
  <span class="blob blob--lemon"></span>
  <span class="ring ring--1"></span>
  <span class="ring ring--2"></span>
  <span class="ring ring--3"></span>

  <div class="stage">
    <h1 class="title">その言い訳、<br>承りました。</h1>
    <p class="tagline">鼻につくアンサージェネレーター</p>
    <div class="sample">
      <div class="sample__row">
        <span class="sample__who">届いた言い訳</span>
        <span class="sample__them">家を出た瞬間、部屋にハトが入ったんです。</span>
      </div>
      <div class="sample__row">
        <span class="sample__who">鼻につく返事</span>
        <span class="sample__you">全然大丈夫ですよ。ちなみに、<mark>何分くらい</mark>いました？</span>
      </div>
    </div>
    <div class="badges">
      <span class="badge">無料・登録不要</span>
      <span class="badge">AIが文章に合わせて返す</span>
      <span class="badge">無料枠が切れても呪文で続行</span>
    </div>
  </div>
</body>
</html>
